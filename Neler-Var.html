<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Neler Var</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800&display=swap">
<style>
/* Layout: a big "selected day" box (burgundy date panel + list of that day's items),
   a seven-day strip under it, then the latest announcements.
   Same palette as the faculty site and the publications page. One light theme on purpose. */
:root {
  --bg: #FFFFFF;
  --ink: #363636;
  --muted: #6A6469;
  --line: #E6E0E2;
  --line-strong: #C9B6BC;
  --brand: #9B2441;
  --brand-ink: #640013;
  --brand-soft: #FFF5F6;
  --bar: #F3EFF0;
  --uni: #3B5A7A;
  --font: 'Open Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { position: relative; max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.375rem; line-height: 1.25; font-weight: 700; color: var(--brand-ink); }
.sample { margin: 0; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--brand-soft); color: var(--brand-ink); font-size: 0.8125rem; }
.err { margin: 0; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bar); font-size: 0.8125rem; }

button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.scopes { display: flex; gap: 8px; flex-wrap: wrap; }
.sc { background: var(--bg); border: 1px solid var(--brand); border-radius: 6px; padding: 6px 12px; min-height: 40px; font-size: 0.875rem; cursor: pointer; }
.sc[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand-ink); border-color: var(--brand-ink); font-weight: 600; box-shadow: 0 1px 4px rgba(100, 0, 19, 0.18); }

/* the big box */
.big { display: grid; grid-template-columns: 200px minmax(0, 1fr); border: 1px solid var(--brand); border-radius: 8px; overflow: hidden; background: var(--bg); }
.date { background: var(--brand); color: #fff; padding: 20px 16px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.kicker { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.9; }
.num { font-size: 4.25rem; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.dm { font-size: 1rem; font-weight: 600; }
.dow { font-size: 1rem; }
.items { padding: 8px 20px; display: flex; flex-direction: column; min-width: 0; }
.item { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.time { font-size: 0.9375rem; font-weight: 700; color: var(--brand-ink); font-variant-numeric: tabular-nums; }
.time.allday { font-weight: 600; color: var(--muted); font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 2px; }
.what { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ttl { margin: 0; font-size: 1.0625rem; line-height: 1.35; font-weight: 600; overflow-wrap: anywhere; }
.ttl a { color: inherit; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.ttl a:hover { color: var(--brand); text-decoration-color: var(--brand); }
.sub { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.875rem; color: var(--muted); }
.tag { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--brand); color: var(--brand-ink); }
.tag.uni { border-color: var(--uni); color: var(--uni); }
.wait { display: flex; align-items: center; gap: 14px; padding: 26px 0; color: var(--muted); font-size: 1rem; }
.spin { flex: none; width: 24px; height: 24px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: sp 0.9s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; border-top-color: var(--brand); } }
.none { padding: 22px 0; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.none p { margin: 0; }
.none .big-msg { font-size: 1.125rem; font-weight: 600; }
.jump { background: var(--bg); border: 1px solid var(--brand); color: var(--brand-ink); border-radius: 6px; padding: 8px 14px; min-height: 40px; cursor: pointer; font-size: 0.875rem; font-weight: 600; text-align: left; }

/* week strip */
.weekbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wk { margin: 0; font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.nav { display: flex; gap: 6px; }
.nb { background: var(--bg); border: 1px solid var(--line-strong); border-radius: 6px; min-width: 44px; min-height: 40px; padding: 0 10px; cursor: pointer; font-size: 0.8125rem; }
.nb:hover { border-color: var(--brand); }
.nb { white-space: nowrap; }
.weekbar { flex-wrap: wrap; }
.mbtn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; margin-left: 10px; padding: 0 12px 0 14px; border: 1px solid var(--brand); border-radius: 6px; background: var(--brand); color: #fff; font-size: 0.875rem; font-weight: 700; cursor: pointer; white-space: nowrap; box-shadow: 0 2px 6px rgba(100, 0, 19, 0.35); transition: transform 0.12s, box-shadow 0.12s; }
.mbtn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(100, 0, 19, 0.4); }
.mbtn .chev { width: 16px; height: 16px; transition: transform 0.2s; }
.mbtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
@media (prefers-reduced-motion: reduce) { .mbtn, .mbtn .chev { transition: none; } }
@media (max-width: 640px) { .weekbar .nav { flex-wrap: wrap; width: 100%; } .mbtn { margin-left: 0; flex: 1 0 100%; justify-content: center; } }
.mbtn:hover { background: var(--brand-ink); border-color: var(--brand-ink); }
.mbtn[aria-expanded="true"] { background: var(--brand-ink); border-color: var(--brand-ink); }
.mbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mbtn:focus-visible { outline-color: var(--brand-ink); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 2px 8px; min-height: 76px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.day:hover { border-color: var(--brand); }
.day .d1 { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.day .d2 { font-size: 1.25rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.day.today { border-color: var(--brand); box-shadow: inset 0 -3px 0 var(--brand); }
.day.past .d2 { color: var(--muted); font-weight: 600; }
.day[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand-ink); box-shadow: 0 1px 4px rgba(100, 0, 19, 0.18); }
.day[aria-pressed="true"].today { box-shadow: inset 0 -3px 0 var(--brand), 0 1px 4px rgba(100, 0, 19, 0.18); }
.dots { display: flex; gap: 3px; min-height: 8px; align-items: center; margin-top: 2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }
.dot.uni { background: var(--bg); border: 1.5px solid var(--uni); }
.more { font-size: 0.6875rem; font-weight: 700; color: var(--brand-ink); }

/* month calendar: a pop-up laid over the day box and week strip, so the page never grows.
   Grid on top, a legend, then the chosen day's items underneath. Several-day items are drawn as bands across the days. */
.month { position: absolute; left: 0; right: 0; z-index: 5; background: var(--bg); border: 1px solid var(--brand); border-radius: 10px; padding: 12px; box-shadow: 0 12px 32px rgba(100, 0, 19, 0.24); overflow-y: auto; }
.month[hidden] { display: none; }
.mh { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.mh strong { flex: 1; text-align: center; font-size: 1.0625rem; font-weight: 700; color: var(--brand-ink); }
.mg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; touch-action: pan-y; }
.mw { text-align: center; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 2px 0 4px; }
.md { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; min-height: 54px; padding: 6px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.9375rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.md:hover { border-color: var(--brand); }
.md.out { background: #FBFAFA; color: var(--muted); font-weight: 400; }
.md.today { border-color: var(--brand); box-shadow: inset 0 -3px 0 var(--brand); }
.md[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand-ink); color: var(--brand-ink); box-shadow: 0 1px 4px rgba(100, 0, 19, 0.18); }
.md[aria-pressed="true"].today { box-shadow: inset 0 -3px 0 var(--brand), 0 1px 4px rgba(100, 0, 19, 0.18); }
.bands { display: flex; flex-direction: column; gap: 2px; margin: 2px -3px 0; width: calc(100% + 6px); }
.bar { display: block; height: 5px; background: var(--brand); position: relative; }
.bar.uni { background: var(--uni); }
.bar.gap { background: none; }
.bar.s { margin-left: 5px; border-radius: 3px 0 0 3px; }
.bar.e { margin-right: 5px; border-radius: 0 3px 3px 0; }
.bar.s.e { border-radius: 3px; }
.bar.c { margin-right: -4px; }
.bar .bl, .tl, .tm { display: none; }
.leg { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0; font-size: 0.75rem; color: var(--muted); }
.leg span { display: inline-flex; align-items: center; gap: 6px; }
.leg i { display: inline-block; flex: none; }
.leg .lf { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
.leg .lu { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--uni); }
.leg .lb { width: 20px; height: 6px; border-radius: 3px; background: var(--brand); }
.mpanel { margin-top: 10px; padding-top: 4px; border-top: 1px solid var(--line); max-height: 170px; overflow-y: auto; }
.mph { margin: 0; padding: 4px 0; font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.mpanel .item { padding: 10px 0; grid-template-columns: 84px minmax(0, 1fr); }
.mpanel .ttl { font-size: 0.9375rem; }
.mpanel .nil { margin: 0; padding: 8px 0 4px; color: var(--muted); }
.ics { background: none; border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 8px; font-size: 0.75rem; font-weight: 600; color: var(--brand-ink); cursor: pointer; }
.ics:hover { border-color: var(--brand); background: var(--brand-soft); }
@media (max-width: 640px) { .month { padding: 10px; } .md { min-height: 46px; font-size: 0.875rem; } .mpanel { max-height: 300px; } .mpanel .item { grid-template-columns: minmax(0, 1fr); } }
@media (min-width: 641px) {
  .md { min-height: 60px; align-items: stretch; padding: 5px 4px 4px; gap: 3px; }
  .md .n { align-self: flex-start; padding-left: 2px; }
  .bands { margin: 2px -5px 0; width: calc(100% + 10px); }
  .bar { height: 15px; }
  .bar .bl { display: block; pointer-events: none; position: absolute; left: 6px; top: 0; z-index: 2; width: calc(var(--n) * (100% + 4px) - 18px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; font-size: 0.6875rem; font-weight: 600; line-height: 15px; text-align: left; }
  .md .dots { display: none; }
  .tl { display: block; border-left: 3px solid var(--brand); padding-left: 4px; font-size: 0.6875rem; font-weight: 600; line-height: 1.3; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .tl.uni { border-left-color: var(--uni); }
  .md.out .tl { color: var(--muted); }
  .tm { display: block; font-size: 0.6875rem; font-weight: 700; color: var(--brand-ink); text-align: left; padding-left: 2px; }
}

/* announcements */
.ann h2 { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 0 0 4px; font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.ann .sb { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 0 4px; cursor: pointer; }
.ann .sb:hover { color: var(--brand-ink); }
.ann .sb[aria-pressed="true"] { color: var(--brand-ink); border-bottom-color: var(--brand); }
.ann .left { margin-left: 6px; white-space: nowrap; font-size: 0.8125rem; font-weight: 700; color: var(--brand-ink); }
.ann .nothing { color: var(--muted); }
.ann ul { list-style: none; margin: 0; padding: 0; }
.ann li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 0.9375rem; }
.ann li:last-child { border-bottom: 0; }
.ann .ad { color: var(--muted); font-size: 0.8125rem; font-variant-numeric: tabular-nums; padding-top: 2px; }
.ann a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; overflow-wrap: anywhere; }
.ann a:hover { color: var(--brand); text-decoration-color: var(--brand); }

@media (max-width: 640px) {
  .big { grid-template-columns: minmax(0, 1fr); }
  .date { flex-direction: row; align-items: center; gap: 14px; padding: 14px 16px; }
  .num { font-size: 2.75rem; }
  .items { padding: 4px 16px; }
  .item { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .day { min-height: 68px; }
  .day .d2 { font-size: 1.0625rem; }
}
</style>

<div class="wrap">
  <div class="head">
    <h1 id="h1"></h1>
    <div class="scopes" id="scopes" role="group"></div>
  </div>
  <p class="sample" id="sample" hidden></p>
  <p class="err" id="err" hidden></p>

  <section class="big" id="big" aria-live="polite">
    <div class="date" id="date"></div>
    <div class="items" id="items"></div>
  </section>

  <div class="weekbar">
    <p class="wk" id="wk"></p>
    <div class="nav">
      <button class="nb" id="prev" type="button"></button>
      <button class="nb" id="cur" type="button"></button>
      <button class="nb" id="next" type="button"></button>
      <button class="mbtn" id="mon" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="month"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="monl"></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
  </div>

<script>
/* ---- settings ---- */
const WIDGET_URL = 'https://script.google.com/macros/s/AKfycbyy5uuS2RcICq_yJCh-_V9FRBvVcjMlNxrdKAd6PrBdh3ICOw37NIB8GRdjyIXmoTtG/exec';            // paste the Google Apps Script web app address between the quotes; empty = demo data
const LANG = 'tr';                // 'tr' or 'en'
const TZ = 'Europe/Istanbul';     // the faculty's time zone: "today" is always today there
const REFRESH_MS = 5 * 60 * 1000;
const MAX_ANN = 5;

const STR = {
  en: {
    title: "What's on", today: 'Today', allDay: 'All day', none: 'Nothing scheduled', nextUp: 'Next up',
    all: 'All', faculty: 'Faculty', university: 'University', ann: 'Latest announcements', dates: 'Key dates', noAnn: 'No announcements.', ongoing: 'Ongoing', tomorrow: 'Tomorrow', daysLeft: n => n + ' days left',
    prev: '‹ Prev', next: 'Next ›', thisWeek: 'This week', month: 'View month', addCal: 'Add to calendar', manyDays: 'Several days', monthOpen: 'Open the monthly calendar', monthShut: 'Close', monthPrev: 'Previous month', monthNext: 'Next month', monthAria: 'Monthly calendar',
    sample: 'Demo entries, shown to preview the layout. Real entries replace them once the data source is connected.',
    loadErr: 'Could not load the latest data. Showing the last saved copy.', loadErrNone: 'Could not load the data right now.',
    loading: 'Loading the latest information… the first load can take a few seconds.', until: 'until', noneAhead: 'Nothing coming up.', more: 'more', locale: 'en-GB'
  },
  tr: {
    title: 'Neler Var', today: 'Bugün', allDay: 'Tüm gün', none: 'Planlanmış bir etkinlik yok', nextUp: 'Sıradaki',
    all: 'Tümü', faculty: 'Fakülte', university: 'Üniversite', ann: 'Son duyurular', dates: 'Yaklaşan tarihler', noAnn: 'Duyuru yok.', ongoing: 'Sürüyor', tomorrow: 'Yarın', daysLeft: n => n + ' gün kaldı',
    prev: '‹ Önceki', next: 'Sonraki ›', thisWeek: 'Bu hafta', month: 'Ayı gör', addCal: 'Takvime ekle', manyDays: 'Birkaç gün süren', monthOpen: 'Aylık takvimi aç', monthShut: 'Kapat', monthPrev: 'Önceki ay', monthNext: 'Sonraki ay', monthAria: 'Aylık takvim',
    sample: 'Örnek kayıtlar; yerleşimi göstermek için konuldu. Veri kaynağı bağlanınca gerçek kayıtlar bunların yerini alır.',
    loadErr: 'Güncel veri alınamadı. Son kaydedilen kopya gösteriliyor.', loadErrNone: 'Veri şu anda alınamadı.',
    loading: 'Güncel bilgiler yükleniyor… ilk açılışta birkaç saniye sürebilir.', until: 'Bitiş:', noneAhead: 'Yaklaşan bir etkinlik yok.', more: 'daha', locale: 'tr-TR'
  }
};
const T = STR[LANG];

/* ---- date helpers (all dates are plain YYYY-MM-DD strings, no time-zone surprises) ---- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
const parse = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null; };
const addDays = (s, n) => { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return ymd(d); };
const mondayOf = s => addDays(s, -((parse(s).getUTCDay() + 6) % 7));
function todayStr() { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
const fmt = (s, o) => new Intl.DateTimeFormat(T.locale, Object.assign({ timeZone: 'UTC' }, o)).format(parse(s));
/* accepts 2026-11-18, 18.11.2026, 18/11/2026 */
function normDate(v) {
  v = String(v == null ? '' : v).trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(v); if (m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
  m = /^(\d{1,2})[./](\d{1,2})[./](\d{4})/.exec(v); if (m) return m[3] + '-' + pad(+m[2]) + '-' + pad(+m[1]);
  return '';
}
const fold = s => String(s || '').replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function normScope(v) { return /^(u|ü)/.test(fold(v).trim()) || /univ|üniv/.test(fold(v)) ? 'university' : 'faculty'; }
const eurl = u => (/^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '');

function normEvents(list) {
  return (list || []).map(r => {
    const start = normDate(r.date || r.start);
    if (!start || !String(r.title || '').trim()) return null;
    let end = normDate(r.end || r.endDate) || start; if (end < start) end = start;
    return { start, end, time: String(r.time || '').trim(), title: String(r.title).trim(), place: String(r.place || '').trim(), scope: normScope(r.scope), url: eurl(r.url) };
  }).filter(Boolean);
}
function normAnn(list) {
  return (list || []).map(r => {
    const date = normDate(r.date); const title = String(r.title || '').trim();
    return title ? { date, title, url: eurl(r.url), scope: normScope(r.scope) } : null;
  }).filter(Boolean).sort((a, b) => b.date.localeCompare(a.date));
}

/* ---- demo data, always relative to today so the preview looks alive ---- */
function demo() {
  const t = todayStr(), d = n => addDays(t, n);
  const x = LANG === 'tr' ? {

/* ---- "add to calendar": one event as an .ics file (opens in Google, Apple and Outlook calendars) ---- */
function tzOffsetMin(y, mo, d, h, mi) {

  const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date(guess));

const icsUtc = ms => { const d = new Date(ms); return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z'; };

}

  let h = 5381; const key = e.start + e.title; for (let i = 0; i < key.length; i++) h = ((h << 5) + h + key.charCodeAt(i)) >>> 0;
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//YOBU Ilahiyat Fakultesi//Neler Var//TR', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    'UID:' + h.toString(16) + '-' + e.start.replace(/-/g, '') + '@neler-var', 'DTSTAMP:' + icsUtc(Date.now()), 'SUMMARY:' + icsEsc(e.title)];
  const tm = /^(\d{1,2}):(\d{2})/.exec(e.time || '');
  if (tm && e.end === e.start) {
    const [y, mo, d] = e.start.split('-').map(Number), hh = +tm[1], mi = +tm[2];
    const off = tzOffsetMin(y, mo, d, hh, mi) * 60000, st = Date.UTC(y, mo - 1, d, hh, mi) - off;
    L.push('DTSTART:' + icsUtc(st), 'DTEND:' + icsUtc(st + 3600000));

  }
  if (e.place) L.push('LOCATION:' + icsEsc(e.place));

}
function downloadIcs(e) {

  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

const MAX_DATES = 5;

  if (S.scope !== 'all') return up(visible()).slice(0, MAX_DATES);
  /* "all": the next three faculty dates and the next two university dates (the other side fills any gap), in date order,

  const f = up(S.events.filter(e => e.scope === 'faculty')), u = up(S.events.filter(e => e.scope === 'university'));
  const nu = Math.min(u.length, Math.max(2, MAX_DATES - f.length)), nf = Math.min(f.length, MAX_DATES - nu);

/* ---- month calendar ---- */
const M = () => $('month');

    .sort((a, b) => a.start.localeCompare(b.start) || b.end.localeCompare(a.end) || a.title.localeCompare(b.title))
    .forEach(e => {
      const s0 = e.start > ws ? e.start : ws, t0 = e.end < we ? e.end : we;
      const i = ends.findIndex(x => x < s0), lane = i < 0 ? ends.length : i;

function renderMonth() {

    for (let c = 0; c < 7; c++) {

/* ---- data ---- */
const CACHE_KEY = 'neler-var-cache';
function apply(data) { S.events = normEvents(data.events); S.ann = normAnn(data.announcements); }
async function load() {
  if (!WIDGET_URL) { S.sample = true; apply(demo()); render(); return; }
  if (S.loading) {   // a copy saved by an earlier visit is shown at once while the fresh data loads
    let c = null; try { c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (x) {}
    if (c) { apply(c); S.loading = false; render(); }
  }
  try {
    const r = await fetch(WIDGET_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const data = await r.json();
    apply(data); S.err = '';
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
  } catch (e) {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (x) {}
    if (cached) { apply(cached); S.err = T.loadErr; } else S.err = T.loadErrNone;
  }
  S.loading = false;
  const t = todayStr(); if (t !== S.today) { if (S.sel === S.today) S.sel = t; S.today = t; }
  render();
}

(function init() {

    const path = e.composedPath ? e.composedPath() : [];   // the clicked day is rebuilt on selection, so judge by the original path
    const inside = path.length ? path.includes(M()) || path.includes($('mon')) : M().contains(e.target) || $('mon').contains(e.target);
    if (monthOpen() && !inside) closeMonth(false);
  });
  $('mgrid').addEventListener('keydown', e => {
    const cur = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.d;
    if ((e.key === 'PageUp' || e.key === 'PageDown') && cur) {
      e.preventDefault();
      const c = parse(cur), n = e.key === 'PageDown' ? 1 : -1, dimN = new Date(Date.UTC(c.getUTCFullYear(), c.getUTCMonth() + n + 1, 0)).getUTCDate();
      const t = ymd(new Date(Date.UTC(c.getUTCFullYear(), c.getUTCMonth() + n, Math.min(c.getUTCDate(), dimN))));
      S.mon = t.slice(0, 7) + '-01'; renderMonth(); const f = $('mgrid').querySelector('[data-d="' + t + '"]'); if (f) f.focus(); return;
    }
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    if (!step || !cur) return;
    e.preventDefault();
    const t = addDays(cur, step);
    if (t.slice(0, 7) !== S.mon.slice(0, 7) && !$('mgrid').querySelector('[data-d="' + t + '"]')) { S.mon = t.slice(0, 7) + '-01'; renderMonth(); }
    const n = $('mgrid').querySelector('[data-d="' + t + '"]'); if (n) n.focus();
  });
  let tx = null, ty = null;   // swipe the grid sideways to change month
  $('mgrid').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  $('mgrid').addEventListener('touchend', e => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) shiftMonth(dx < 0 ? 1 : -1);
  }, { passive: true });
  render();
  load();
  if (WIDGET_URL) setInterval(load, REFRESH_MS);
})();
