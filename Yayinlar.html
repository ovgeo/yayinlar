<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yayınlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #FFFFFF; --ink: #363636; --muted: #5F5F5F; --line: #E4E0E1; --line-strong: #B9B2B4;
  --brand: #9B2441; --brand-ink: #640013; --brand-soft: #FFF5F6;
  --font: 'Open Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; padding: 0 16px 28px; font-family: var(--font); color: var(--ink); font-size: 1rem; line-height: 1.45; }
.wrap { max-width: 920px; margin: 0 auto; }
button, input, select { font: inherit; }
:focus-visible { outline: 3px solid var(--brand-ink); outline-offset: 2px; }

.bar { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
.search { position: relative; }
.search input { width: 100%; min-height: 44px; padding: 0 44px 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 1rem; }
.search input:focus { border-color: var(--brand); outline: 3px solid var(--brand-ink); outline-offset: 1px; }
.search .x { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 1.25rem; cursor: pointer; display: none; }
.search .x:hover { background: var(--brand-soft); color: var(--brand-ink); }
.search.has .x { display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { min-height: 40px; padding: 0 14px; border: 1px solid var(--brand); border-radius: 8px; background: var(--bg); color: var(--brand-ink); font-size: 0.875rem; font-weight: 600; cursor: pointer; }
.chip:hover { background: var(--brand-soft); }
.chip[aria-pressed="true"] { background: var(--brand); color: #fff; }
.sels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.sels label { display: block; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.sels select { display: block; width: 100%; min-height: 44px; margin-top: 2px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 0.9375rem; }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin: 8px 0 0; font-size: 0.8125rem; color: var(--muted); }
.meta .reset { min-height: 0; padding: 0; border: 0; background: none; color: var(--brand-ink); font-weight: 600; text-decoration: underline; cursor: pointer; display: none; }
.meta .reset.on { display: inline; }

h2 { margin: 22px 0 2px; font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand-ink); }
ul { list-style: none; margin: 0; padding: 0; }
.y { padding: 12px 0; border-bottom: 1px solid var(--line); }
.y:last-child { border-bottom: 0; }
.t { font-size: 1.0625rem; font-weight: 700; line-height: 1.35; }
.t a { color: var(--ink); text-decoration: none; }
.t a:hover { color: var(--brand); text-decoration: underline; }
.au { margin-top: 3px; font-size: 0.9375rem; }
.src { margin-top: 1px; font-size: 0.875rem; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 6px; }
.tag { display: inline-block; padding: 1px 8px; border: 1.5px solid var(--brand); border-radius: 4px; color: var(--brand-ink); font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.tag.k { border-color: var(--line-strong); color: var(--muted); }
.lnk { display: inline-flex; align-items: center; min-height: 32px; font-size: 0.8125rem; font-weight: 600; color: var(--brand-ink); }
.fk { font-size: 0.8125rem; color: var(--muted); }
.more { display: block; margin: 18px auto 0; min-height: 44px; padding: 0 22px; border: 1px solid var(--brand); border-radius: 8px; background: var(--bg); color: var(--brand-ink); font-weight: 600; cursor: pointer; }
.more:hover { background: var(--brand-soft); }
.none { padding: 28px 0; color: var(--muted); text-align: center; }
.note { margin-top: 24px; font-size: 0.8125rem; color: var(--muted); }
@media (max-width: 700px) { .t { font-size: 1rem; } .bar { position: static; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="search" id="sw">
      <input id="q" type="search" placeholder="Başlık, yazar, dergi veya yıl ara..." aria-label="Yayınlarda ara" autocomplete="off">
      <button type="button" class="x" id="qx" aria-label="Aramayı temizle">×</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Yayın türü"></div>
    <div class="sels">
      <div><label for="kisi">Öğretim elemanı</label><select id="kisi"></select></div>
      <div><label for="yil">Yıl</label><select id="yil"></select></div>
      <div><label for="dizin">Dizin</label><select id="dizin"></select></div>
      <div><label for="sira">Sıralama</label><select id="sira"><option value="yeni">Yeniden eskiye</option><option value="eski">Eskiden yeniye</option><option value="ad">Başlığa göre (A–Z)</option></select></div>
    </div>
    <div class="meta"><span id="count" aria-live="polite"></span><button type="button" class="reset" id="reset">Filtreleri temizle</button></div>
  </div>
  <div id="list"></div>
  <p class="note" id="note"></p>
</div>
<script>
(async () => {
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const fold = s => (s || '').replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i');
const TR = new Intl.Collator('tr');
const SAYFA = 60;

let D;
try {
  const r = await fetch('yayinlar.json', { cache: 'no-cache' });
  if (!r.ok) throw new Error('http');
  D = await r.json();
} catch (e) {
  $('list').appendChild(el('p', 'none', 'Yayın listesi şu anda yüklenemedi. Lütfen daha sonra tekrar deneyin.'));
  $('sw').parentElement.querySelector('.chips').hidden = true; document.querySelector('.sels').hidden = true; $('count').textContent = '';
  return;
}
const KISI = {}; D.kisiler.forEach(k => KISI[k.id] = k);
const Y = D.yayinlar.map(y => {
  const fak = (y.kisiler || []).map(id => KISI[id] && KISI[id].ad_soyad).filter(Boolean);
  return Object.assign({}, y, { fak, hay: fold([y.baslik, y.yazarlar, y.kaynak, y.yil, fak.join(' ')].join(' ')) });
});

// filtre denetimleri
const TURLER = ['Makale', 'Bildiri', 'Kitap', 'Kitap bölümü'];
const durum = { q: '', tur: '', kisi: '', yil: '', dizin: '', sira: 'yeni', n: SAYFA };
const var_ = new Set(Y.map(y => y.tur));
const chips = $('chips');
[['', 'Tümü']].concat(TURLER.filter(t => var_.has(t)).map(t => [t, t === 'Makale' ? 'Makaleler' : t === 'Bildiri' ? 'Bildiriler' : t === 'Kitap' ? 'Kitaplar' : 'Kitap bölümleri']))
  .concat(var_.has('Diğer') ? [['Diğer', 'Diğer']] : []).forEach(([v, ad]) => {
    const b = el('button', 'chip', ad); b.type = 'button'; b.dataset.v = v; b.setAttribute('aria-pressed', String(v === '')); chips.appendChild(b);
  });
chips.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; durum.tur = b.dataset.v; chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b))); durum.n = SAYFA; ciz(); });

function sec(id, ilk, secenekler) { const s = $(id); s.replaceChildren(); s.appendChild(new Option(ilk, '')); secenekler.forEach(o => s.appendChild(o)); }
// kişi seçeneği: bölüme göre grup
const grup = {};
D.kisiler.filter(k => k.sayi > 0).forEach(k => (grup[k.bolum || 'Diğer'] = grup[k.bolum || 'Diğer'] || []).push(k));
const kisiOpts = Object.keys(grup).sort(TR.compare).map(b => { const g = document.createElement('optgroup'); g.label = b; grup[b].sort((a, c) => TR.compare(a.ad_soyad, c.ad_soyad)).forEach(k => g.appendChild(new Option(`${k.ad_soyad} (${k.sayi})`, k.id))); return g; });
sec('kisi', 'Tümü', kisiOpts);
const yillar = [...new Set(Y.map(y => y.yil).filter(Boolean))].sort((a, b) => b - a);
sec('yil', 'Tümü', yillar.map(y => new Option(String(y), String(y))));
const dizinler = {}; Y.forEach(y => (y.indeks || []).forEach(d => dizinler[d] = (dizinler[d] || 0) + 1));
sec('dizin', 'Tümü', Object.keys(dizinler).sort((a, b) => dizinler[b] - dizinler[a]).map(d => new Option(`${d} (${dizinler[d]})`, d)));

const q = $('q');
q.addEventListener('input', () => { durum.q = q.value; $('sw').classList.toggle('has', !!q.value); durum.n = SAYFA; ciz(); });
$('qx').addEventListener('click', () => { q.value = ''; durum.q = ''; $('sw').classList.remove('has'); durum.n = SAYFA; ciz(); q.focus(); });
['kisi', 'yil', 'dizin', 'sira'].forEach(k => $(k).addEventListener('change', e => { durum[k] = e.target.value; durum.n = SAYFA; ciz(); }));
$('reset').addEventListener('click', () => {
  Object.assign(durum, { q: '', tur: '', kisi: '', yil: '', dizin: '', sira: 'yeni', n: SAYFA });
  q.value = ''; $('sw').classList.remove('has'); ['kisi', 'yil', 'dizin'].forEach(k => $(k).value = ''); $('sira').value = 'yeni';
  chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v === ''))); ciz();
});
const p0 = new URLSearchParams(location.search).get('kisi');
if (p0 && KISI[p0]) { durum.kisi = p0; $('kisi').value = p0; }

function filtre() {
  const w = fold(durum.q).split(/\s+/).filter(Boolean);
  let L = Y.filter(y => (!durum.tur || y.tur === durum.tur) && (!durum.kisi || (y.kisiler || []).includes(durum.kisi)) &&
    (!durum.yil || String(y.yil) === durum.yil) && (!durum.dizin || (y.indeks || []).includes(durum.dizin)) && w.every(t => y.hay.includes(t)));
  if (durum.sira === 'yeni') L = L.slice().sort((a, b) => (b.yil || 0) - (a.yil || 0) || TR.compare(a.baslik, b.baslik));
  else if (durum.sira === 'eski') L = L.slice().sort((a, b) => (a.yil || 9999) - (b.yil || 9999) || TR.compare(a.baslik, b.baslik));
  else if (durum.sira === 'ad') L = L.slice().sort((a, b) => TR.compare(a.baslik, b.baslik));
  return L;
}
function madde(y) {
  const li = el('li', 'y'), t = el('div', 't');
  if (y.url) { const a = el('a', null, y.baslik); a.href = y.url; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', y.baslik + ' – Avesis kaydı (yeni sekmede açılır)'); t.appendChild(a); } else t.textContent = y.baslik;
  li.appendChild(t);
  if (y.yazarlar) li.appendChild(el('div', 'au', y.yazarlar));
  if (y.kaynak) li.appendChild(el('div', 'src', y.kaynak));
  const r = el('div', 'row');
  if (y.tur) r.appendChild(el('span', 'tag', y.tur));
  (y.indeks || []).forEach(d => r.appendChild(el('span', 'tag k', d)));
  if (y.doi) { const a = el('a', 'lnk', 'DOI'); a.href = 'https://doi.org/' + y.doi; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', 'DOI bağlantısı (yeni sekmede açılır)'); r.appendChild(a); }
  if (r.childNodes.length) li.appendChild(r);
  return li;
}
function ciz() {
  const L = filtre(), list = $('list'); list.replaceChildren();
  const aktif = durum.q || durum.tur || durum.kisi || durum.yil || durum.dizin || durum.sira !== 'yeni';
  $('reset').classList.toggle('on', !!aktif);
  $('count').textContent = L.length === Y.length ? `${Y.length} yayın` : `${L.length} yayın (toplam ${Y.length})`;
  if (!L.length) { list.appendChild(el('p', 'none', 'Aramanızla eşleşen yayın bulunamadı.')); return; }
  const gorunen = L.slice(0, durum.n); let ul = null, son = null;
  gorunen.forEach(y => {
    if (durum.sira !== 'ad') {
      const g = y.yil || 'Yılı belirtilmemiş';
      if (g !== son) { son = g; list.appendChild(el('h2', null, String(g))); ul = el('ul'); list.appendChild(ul); }
    } else if (!ul) { ul = el('ul'); list.appendChild(ul); }
    ul.appendChild(madde(y));
  });
  if (L.length > gorunen.length) {
    const b = el('button', 'more', `Daha fazla göster (${L.length - gorunen.length} yayın daha)`); b.type = 'button';
    b.addEventListener('click', () => { durum.n += SAYFA; const y0 = scrollY; ciz(); scrollTo(0, y0); }); list.appendChild(b);
  }
}
const tar = D.guncelleme ? new Date(D.guncelleme) : null;
$('note').textContent = 'Yayın bilgileri, öğretim elemanlarının AVESİS profillerinden otomatik olarak derlenir' + (tar && !isNaN(tar) ? ' (son güncelleme: ' + tar.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }) + ')' : '') + '. Eksik veya hatalı bir kayıt için ilgili öğretim elemanının AVESİS profili güncellenmelidir.';
ciz();
})();
</script>
</body>
</html>
