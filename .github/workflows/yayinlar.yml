name: Yayınları güncelle

on:
  schedule:
    - cron: "17 3 * * 1"      # her pazartesi 03:17 UTC
  workflow_dispatch:           # elle de çalıştırılabilir (Actions sekmesi > Run workflow)

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python fetch_yayinlar.py
      - name: Değişiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain yayinlar.json)" ]; then
            git config user.name "yayinlar-bot"
            git config user.email "yayinlar-bot@users.noreply.github.com"
            git add yayinlar.json
            git commit -m "Yayın verisi güncellendi"
            git push
          else
            echo "Değişiklik yok."
          fi
