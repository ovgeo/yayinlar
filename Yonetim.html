<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fakülte Yönetimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #FFFFFF; --ink: #363636; --muted: #5F5F5F; --line: #E4E0E1; --line-strong: #B9B2B4;
  --brand: #9B2441; --brand-ink: #640013; --brand-soft: #FFF5F6;
  --font: 'Open Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; padding: 0 16px 24px; font-family: var(--font); color: var(--ink); font-size: 1rem; line-height: 1.45; }
.wrap { max-width: 920px; margin: 0 auto; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--brand-ink); outline-offset: 2px; }

.bar { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { min-height: 40px; padding: 0 16px; border: 1px solid var(--brand); border-radius: 8px; background: var(--bg); color: var(--brand-ink); font-size: 0.875rem; font-weight: 600; cursor: pointer; }
.tab:hover { background: var(--brand-soft); }
.tab[aria-selected="true"] { background: var(--brand); color: #fff; }
[role=tabpanel][hidden] { display: none; }

h2 { margin: 22px 0 4px; font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand-ink); }
ul { list-style: none; margin: 0; padding: 0; }
.u { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.n { font-weight: 700; }

/* Dekanlık cards */
.dk { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.dk:last-child { border-bottom: 0; }
.dk .ph { grid-row: 1 / span 2; }
.dk > .acts { grid-column: 2; margin-top: 0; align-self: start; }
.ph { width: 112px; height: 140px; border-radius: 8px; object-fit: cover; object-position: top; background: var(--brand-soft); }
.ph.ini { display: flex; align-items: center; justify-content: center; color: var(--brand-ink); font-size: 1.75rem; font-weight: 700; border: 1px solid var(--line); }
.dk .n { font-size: 1.125rem; }
.dk .a { margin-top: 2px; font-size: 0.9375rem; }
.dk .t { margin-top: 2px; font-size: 0.875rem; color: var(--muted); }
.role { display: inline-block; margin-top: 6px; padding: 1px 8px; border: 1.5px solid var(--brand); border-radius: 4px; color: var(--brand-ink); font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1px solid var(--brand); border-radius: 8px; background: var(--bg); color: var(--brand-ink); font-family: inherit; font-size: 0.875rem; font-weight: 600; text-decoration: none; white-space: nowrap; cursor: pointer; }
.btn:hover { background: var(--brand-soft); }
.btn.pri { background: var(--brand); color: #fff; }
.btn.pri:hover { background: var(--brand-ink); border-color: var(--brand-ink); }
.btn.done { background: var(--brand-ink); border-color: var(--brand-ink); color: #fff; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ext { font-size: 0.8125rem; color: var(--muted); white-space: nowrap; }
.mail { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; padding: 6px 6px 6px 12px; border-radius: 8px; background: var(--brand-soft); color: var(--brand-ink); }
.mail[hidden] { display: none; }
.mail .addr { font-size: 0.9375rem; font-weight: 600; word-break: break-all; user-select: all; -webkit-user-select: all; }
.mail .btn { min-height: 36px; padding: 0 12px; }

/* Dean's message */
.msg { grid-column: 1 / -1; border: 1px solid var(--line-strong); border-radius: 8px; }
.msg summary { cursor: pointer; padding: 10px 14px; font-weight: 600; color: var(--brand-ink); }
.msg summary:hover { background: var(--brand-soft); }
.msg .txt { padding: 4px 16px 14px; border-top: 1px solid var(--line); }
.msg p { margin: 10px 0 0; }
.msg .sig { margin-top: 14px; font-weight: 700; }
.msg .sig span { display: block; font-weight: 400; color: var(--muted); }

/* Bölümler */
.bol { border: 1px solid var(--line-strong); border-radius: 8px; margin-top: 12px; }
.bol > summary { cursor: pointer; padding: 12px 14px; list-style: none; }
.bol > summary::-webkit-details-marker { display: none; }
.bol > summary:hover { background: var(--brand-soft); }
.bol .bt { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 1.0625rem; font-weight: 700; color: var(--brand-ink); }
.bol .bt::after { content: ''; width: 9px; height: 9px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform .15s; flex: none; margin-right: 4px; }
.bol[open] .bt::after { transform: rotate(-135deg); }
.bol .bm { margin-top: 4px; font-size: 0.875rem; color: var(--muted); }
.bol .bm b { color: var(--ink); }
.abds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 4px 14px 14px; border-top: 1px solid var(--line); }
.abd { padding-top: 10px; }
.abd h3 { margin: 0; font-size: 0.9375rem; font-weight: 700; }
.abd .hd { margin: 4px 0 0; font-size: 0.9375rem; }
.abd .hd .tag { display: block; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--brand-ink); }
.abd ul { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); font-size: 0.9375rem; }
.abd li { padding: 1px 0; }
.abd .u { margin-right: 4px; }

/* Kurullar */
.kr li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.kr li:last-child { border-bottom: 0; }
.kr .r { color: var(--muted); font-size: 0.9375rem; }
.note { margin: 6px 0 0; font-size: 0.8125rem; color: var(--muted); }

@media (max-width: 640px) {
  .dk { grid-template-columns: 88px minmax(0, 1fr); }
  .ph { width: 88px; height: 110px; }
  .dk .ph { grid-row: 1; }
  .dk > .acts { grid-column: 1 / -1; }
  .abds { grid-template-columns: minmax(0, 1fr); }
  .kr li { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

const MESAJ = [
  'Değerli meslektaşlarım, kıymetli öğrencilerimiz ve saygıdeğer misafirlerimiz!',
  'Yozgat Bozok Üniversitesi İlahiyat Fakültesi Dekanı olarak sizleri fakülte sitemizde görmekten ve bu satırlar aracılığı ile sizlere ulaşmaktan, duygu ve düşüncelerimi sizlerle paylaşmaktan duyduğum mutluluğu belirtmek isterim.',
  'Yozgat Bozok Üniversitesi İlahiyat Fakültesi, 13.09.2010 tarihli Bakanlar Kurulu kararı ile kurulmuş, Yozgatlı hayırsever iş insanı Bilal Şahin’in uygulama camii ve fakülte binasını inşa ettirip Üniversitemize teslimi ile birlikte 2012-2013 eğitim-öğretim dönemi itibarıyla öğrenci alımına başlamış genç bir fakültedir.',
  'Yozgat Bozok Üniversitesi İlahiyat Fakültesi olarak; Cumhuriyetin temel değerlerine bağlı, öğrenmeyi, öğretmeyi ve insan gelişimini temel alarak kendisini yenileyen, geliştiren; eleştirel bakış açısına sahip, yeniliklere açık, topluma rehberlik edebilen, milli ve manevi değerleri içselleştirmiş, İslami ilimlerin temel konularında donanımlı, mesleğinin öneminin bilincinde olan ve sorumluluk sahibi bireyler yetiştirmek başlıca hedeflerimizdir.',
  'Bir yıllık zorunlu hazırlık eğitiminin ardından dört yıllık lisans eğitim müfredatı uygulanan Fakültemizde, Temel İslam Bilimleri, Felsefe ve Din Bilimleri, İslam Tarihi ve Sanatları olmak üzere üç bölüm bulunmaktadır. Bu üç bölümümüzde yüksek lisans programı, Temel İslam Bilimleri Bölümü’nde ise doktora programı açıktır. Fakültemizdeki eğitim öğretim süreçleri, 7 profesör, 6 doçent, 13 doktor öğretim üyesi, 9 öğretim görevlisi ve 12 araştırma görevlisi ile yürütülmektedir. Yozgat Bozok Üniversitesi İlahiyat Fakültesi, kaliteli akademik kadrosu ve modern eğitim imkânları ile Türkiye’nin önemli ilahiyat fakültelerinden biri olma yolunda hızlı ve emin adımlarla ilerlemektedir. Mezunlarımız, başta Diyanet İşleri Başkanlığı ve Milli Eğitim Bakanlığı olmak üzere çeşitli kamu kurum ve kuruluşlarında görev alabilmektedir.',
  'Fakültemize her zaman destek veren, bize güvenen, öğrencilerimizin hak ettikleri eğitimi en iyi şartlarda almalarını sağlayan Rektörümüz Prof. Dr. Evren Yaşar’a, Fakültemizin kuruluşundan bugüne kadar Fakültemize desteklerini esirgemeyen Yozgatlı iş insanı hayırsever Bilal Şahin’e, tüm üniversite yönetimine ve fakültemize katkı sağlayan bütün mesai ve çalışma arkadaşlarıma, sevgili öğrencilerime çok teşekkür ederim. Hep birlikte Üniversitemize ve Fakültemize ait değerler ve ilkeler ışığında, sorumluluğumuzun bilincinde olarak, Yozgat Bozok Üniversitesi İlahiyat Fakültemizi sürekli geliştirip güçlendirerek daha ilerilere taşıyacağımıza olan inancım tamdır.'
];

  ['', 'Eminhan DEMİR', 'Fakülte Öğrenci Temsilcisi'],
  ['', 'Muhammed Fatih DUYAR', 'Mezun Öğrenci Temsilcisi'],
  ['', 'Tuncay TAŞ', 'Okul Müdürü (Milli Eğitim Müdürlüğü)'],
  ['', 'Atilla YILMAZ', 'Öğretmen (Milli Eğitim Müdürlüğü)'],
  ['', 'Hüseyin DURMAZ', 'Bilgisayar İşletmeni (İl Müftülüğü)']
];

const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const icon = d => '<svg viewBox="0 0 24 24" aria-hidden="true">' + d + '</svg>';
async function copyText(t) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch (e) { /* blocked inside the frame: use the fallback */ }
  try {
    const x = document.createElement('textarea'); x.value = t; x.setAttribute('readonly', ''); x.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(x); x.select(); x.setSelectionRange(0, t.length);
    const ok = document.execCommand('copy'); x.remove(); return ok;
  } catch (e) { return false; }
}
function mailPart(p, acts) {   // "E-postayı göster" button + strip with the address and a copy button; no mailto link
  const addr = p.m + '@' + MAILDOM;
  const show = el('button', 'btn'); show.type = 'button'; show.setAttribute('aria-expanded', 'false'); show.setAttribute('aria-label', p.n + ' – e-posta adresini göster');
  const showLbl = open => { show.innerHTML = icon('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'); show.appendChild(document.createTextNode(open ? 'Gizle' : 'E-postayı göster')); };
  showLbl(false);
  const box = el('div', 'mail'); box.hidden = true;
  const txt = el('span', 'addr');
  const copy = el('button', 'btn'); copy.type = 'button'; copy.setAttribute('aria-label', p.n + ' – e-posta adresini kopyala');
  const copyLbl = t => { copy.innerHTML = icon('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'); copy.appendChild(document.createTextNode(t)); };
  copyLbl('Kopyala'); box.append(txt, copy);
  show.addEventListener('click', () => { const o = box.hidden; box.hidden = !o; txt.textContent = o ? addr : ''; show.setAttribute('aria-expanded', String(o)); showLbl(o); });
  let timer;
  copy.addEventListener('click', async () => {
    const ok = await copyText(addr); clearTimeout(timer);
    if (ok) { copy.classList.add('done'); copyLbl('Kopyalandı'); }
    else { copyLbl('Elle kopyalayın'); const r = document.createRange(); r.selectNodeContents(txt); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    timer = setTimeout(() => { copy.classList.remove('done'); copyLbl('Kopyala'); }, 2000);
  });
  acts.appendChild(show); return box;
}
function link(cls, href, text, label) { const a = el('a', cls, text); a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', label + ' (yeni sekmede açılır)'); return a; }

/* Dekanlık */
DEK.forEach(p => {
  const li = el('li', 'dk');
  if (p.ph) { const i = el('img', 'ph'); i.src = PH[p.ph]; i.alt = (p.u ? p.u + ' ' : '') + p.n; i.width = 112; i.height = 140; li.appendChild(i); }
  else li.appendChild(el('div', 'ph ini', p.ini));
  const info = el('div');
  if (p.u) info.appendChild(el('div', 'u', p.u));
  info.appendChild(el('div', 'n', p.n));
  info.appendChild(el('span', 'role', p.role));
  if (p.t) info.appendChild(el('div', 't', p.t));
  if (p.a) info.appendChild(el('div', 'a', p.a));
  li.appendChild(info);
  const acts = el('div', 'acts');
  if (p.av) acts.appendChild(link('btn pri', AVESIS + p.av, 'Avesis profili', p.n + ' – Avesis profili'));
  if (p.gt) acts.appendChild(link('btn', DOSYA + p.gt + '.pdf', 'Görev tanımı', p.n + ' – görev tanımı (PDF)'));
  if (p.oz) acts.appendChild(link('btn', DOSYA + p.oz + '.pdf', 'Özgeçmiş', p.n + ' – özgeçmiş (PDF)'));
  const box = mailPart(p, acts);
  if (p.d) acts.appendChild(el('span', 'ext', 'Dahili ' + p.d));
  li.appendChild(acts); li.appendChild(box);
  if (p.msg) {
    const d = el('details', 'msg'), s = el('summary', null, 'Dekan’ın mesajı'), t = el('div', 'txt');
    MESAJ.forEach(x => t.appendChild(el('p', null, x)));
    const sig = el('p', 'sig', 'Prof. Dr. İsmail Pırlanta'); sig.appendChild(el('span', null, 'İlahiyat Fakültesi Dekanı')); t.appendChild(sig);
    d.append(s, t); li.appendChild(d);
  }
  $('dk').appendChild(li);
});

/* Bölümler */
const person = (u, n) => { const s = el('span'); if (u) s.appendChild(el('span', 'u', u)); s.appendChild(document.createTextNode(' ')); s.appendChild(el('span', 'n', n)); return s; };
BOL.forEach((b, k) => {
  const d = el('details', 'bol'); if (k === 0) d.open = true; d.id = b.id;
  const s = el('summary'); s.appendChild(el('div', 'bt', b.ad));
  const m = el('div', 'bm'); m.append('Bölüm Başkanı: ', el('b', null, b.b[0] + ' ' + b.b[1]), ' · Yardımcısı: ', el('b', null, b.y[0] + ' ' + b.y[1]));
  s.appendChild(m); d.appendChild(s);
  const g = el('div', 'abds');
  b.abd.forEach(a => {
    const c = el('div', 'abd'); c.appendChild(el('h3', null, a.ad + ' Anabilim Dalı'));
    const h = el('p', 'hd'); h.appendChild(el('span', 'tag', a.u ? 'Anabilim Dalı Başkanı (uhdesinde)' : 'Anabilim Dalı Başkanı')); h.appendChild(person(a.b[0], a.b[1])); c.appendChild(h);
    const rest = a.m.filter(x => x[1] !== a.b[1]);
    if (rest.length) { const ul = el('ul'); rest.forEach(x => { const li = el('li'); li.appendChild(person(x[0], x[1])); ul.appendChild(li); }); c.appendChild(ul); }
    g.appendChild(c);
  });
  d.appendChild(g); $('bol').appendChild(d);
});

/* Kurullar */
function kurul(title, rows, note) {
  $('p-kurullar').appendChild(el('h2', null, title));
  const ul = el('ul', 'kr');
  rows.forEach(r => { const li = el('li'); li.appendChild(person(r[0], r[1])); li.appendChild(el('span', 'r', r[2])); ul.appendChild(li); });
  $('p-kurullar').appendChild(ul);
  if (note) $('p-kurullar').appendChild(el('p', 'note', note));
}
kurul('Fakülte Yönetim Kurulu', YK);
kurul('Fakülte Kurulu', FK);
kurul('Danışma Kurulu', DK, 'Başkan dışındaki herkes kurul üyesidir.');

/* Tabs (the address can end in #dekanlik, #bolumler or #kurullar to open a tab directly) */
const TABS = [['dekanlik', 'Dekanlık'], ['bolumler', 'Bölümler ve Anabilim Dalları'], ['kurullar', 'Kurullar']];
function select(id) {
  if (!TABS.some(t => t[0] === id)) id = 'dekanlik';
  TABS.forEach(([k]) => { $('p-' + k).hidden = k !== id; $('t-' + k).setAttribute('aria-selected', String(k === id)); $('t-' + k).tabIndex = k === id ? 0 : -1; });
}
TABS.forEach(([k, t], i) => {
  const b = el('button', 'tab', t); b.type = 'button'; b.id = 't-' + k; b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', 'p-' + k);
  b.addEventListener('click', () => select(k));
  b.addEventListener('keydown', e => { const j = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (j) { const n = TABS[(i + j + TABS.length) % TABS.length][0]; select(n); $('t-' + n).focus(); } });
  $('tabs').appendChild(b);
});
select(location.hash.slice(1));
</script>
