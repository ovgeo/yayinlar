<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fakültemiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #FFFFFF; --ink: #363636; --muted: #5F5F5F; --line: #E4E0E1; --line-strong: #B9B2B4;
  --brand: #9B2441; --brand-ink: #640013; --brand-soft: #FFF5F6;
  --font: 'Open Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; padding: 0 16px 24px; font-family: var(--font); color: var(--ink); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; }
button, input { font: inherit; }
:focus-visible { outline: 3px solid var(--brand-ink); outline-offset: 2px; }
.bar { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { min-height: 40px; padding: 0 16px; border: 1px solid var(--brand); border-radius: 8px; background: var(--bg); color: var(--brand-ink); font-size: 0.875rem; font-weight: 600; cursor: pointer; }
.tab:hover { background: var(--brand-soft); }
.tab[aria-selected="true"] { background: var(--brand); color: #fff; }
[role=tabpanel][hidden] { display: none; }
h2 { margin: 22px 0 4px; font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand-ink); }
h3 { margin: 14px 0 6px; font-size: 0.9375rem; font-weight: 700; }
ul, ol { margin: 0; padding: 0; }
.u { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.n { font-weight: 700; }
.note { margin: 6px 0 0; font-size: 0.8125rem; color: var(--muted); }

/* dropdown blocks */
.bol { border: 1px solid var(--line-strong); border-radius: 8px; margin-top: 12px; scroll-margin-top: 72px; }
.bol > summary { cursor: pointer; padding: 12px 14px; list-style: none; }
.bol > summary::-webkit-details-marker { display: none; }
.bol > summary:hover { background: var(--brand-soft); }
.bol .bt { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 1.0625rem; font-weight: 700; color: var(--brand-ink); }
.bol .bt::after { content: ''; width: 9px; height: 9px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform .15s; flex: none; margin-right: 4px; }
.bol[open] > summary .bt::after { transform: rotate(-135deg); }
.bol .bm { margin-top: 2px; font-size: 0.875rem; color: var(--muted); }
.kbody { padding: 4px 14px 14px; border-top: 1px solid var(--line); }
.bol .bol { margin-top: 8px; }
.bol .bol > summary { padding: 9px 12px; }
.bol .bol .bt { font-size: 0.9375rem; }

/* rows */
.kr { list-style: none; }
.kr li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.kr li:last-child { border-bottom: 0; }
.kr .r { color: var(--muted); font-size: 0.9375rem; }
.nt { color: var(--muted); font-size: 0.8125rem; }
.rl { margin: 10px 0 2px; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--brand-ink); }

/* buttons / links */
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1px solid var(--brand); border-radius: 8px; background: var(--bg); color: var(--brand-ink); font-size: 0.875rem; font-weight: 600; text-decoration: none; cursor: pointer; }
.btn:hover { background: var(--brand-soft); }
.btn.pri { background: var(--brand); color: #fff; }
.btn.pri:hover { background: var(--brand-ink); border-color: var(--brand-ink); }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.links a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 8px; color: var(--brand-ink); font-weight: 600; font-size: 0.9375rem; text-decoration: none; }
.links a:hover { background: var(--brand-soft); border-color: var(--brand); }
.links a span.t { font-size: 0.6875rem; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; flex: none; }

/* quality policy */
.pol { margin: 8px 0 0; padding-left: 22px; }
.pol li { padding: 4px 0; }
.sig { margin-top: 14px; font-weight: 700; }
.sig span { display: block; font-weight: 400; color: var(--muted); }

/* commissions */
.srch { width: 100%; min-height: 44px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 1rem; margin: 10px 0 2px; }
.cnt { font-size: 0.8125rem; color: var(--muted); margin: 4px 0 0; }
.hit { background: #FFF1B8; }

/* photos */
.phb { position: relative; float: left; width: 112px; height: 140px; padding: 0; margin: 12px 16px 6px 0; border: 0; border-radius: 8px; background: none; cursor: zoom-in; }
.phb .ph { width: 100%; height: 100%; display: block; object-fit: cover; object-position: top; border-radius: 8px; }
.phb .zm { position: absolute; right: 6px; bottom: 6px; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--brand-ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.phb .zm svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.lb { border: 0; padding: 0; background: #000; border-radius: 10px; max-width: min(92vw, 520px); max-height: 94vh; overflow: hidden; }
.lb::backdrop { background: rgba(0,0,0,.78); }
.lb img { display: block; width: 100%; max-height: calc(94vh - 56px); object-fit: contain; cursor: zoom-out; background: #000; }
.lb .cap { margin: 0; padding: 10px 16px 12px; color: #fff; font-size: 0.9375rem; font-weight: 600; background: #1b1b1b; }
.lb .x { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 1.5rem; line-height: 1; cursor: pointer; }
.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 0; }
.chips li { padding: 4px 12px; border: 1.5px solid var(--brand); border-radius: 999px; color: var(--brand-ink); font-weight: 600; font-size: 0.9375rem; }
/* service standards */
.sv { padding: 10px 0; border-bottom: 1px solid var(--line); }
.sv .nm { font-weight: 700; }
.sv .du { display: inline-block; margin-top: 3px; padding: 1px 8px; border-radius: 4px; background: var(--brand-soft); color: var(--brand-ink); font-size: 0.8125rem; font-weight: 600; }
.dl { margin: 2px 0 0; padding-left: 18px; font-size: 0.9375rem; }
.ct .cr { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 4px 12px; padding: 4px 0; font-size: 0.9375rem; }
.ct .r { color: var(--muted); }
.kbody::after { content: ''; display: block; clear: both; }
/* org tree */
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 6px; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { padding-left: 20px; }
.tree li { position: relative; padding: 5px 0 5px 20px; }
.tree > li { padding-left: 0; }
.tree > li::before, .tree > li::after { display: none; }
.tree li::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--line-strong); }
.tree li:last-child::before { bottom: auto; height: 22px; }
.tree li::after { content: ''; position: absolute; left: 0; top: 22px; width: 16px; border-top: 2px solid var(--line-strong); }
.nd { display: inline-flex; flex-direction: column; align-items: flex-start; text-align: left; max-width: 100%; padding: 6px 12px; border: 1.5px solid var(--brand); border-radius: 8px; background: var(--bg); color: var(--ink); }
button.nd { cursor: pointer; }
button.nd:hover { background: var(--brand-soft); }
.nd .l { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--brand-ink); font-size: 0.9375rem; }
.nd .l::before { content: ''; flex: none; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
div.nd .l::before { display: none; }
button.nd[aria-expanded="true"] .l::before { transform: rotate(45deg); }
.nd .p { font-size: 0.8125rem; color: var(--ink); }
.nd .s { font-size: 0.75rem; color: var(--muted); }
.tree .kids[hidden] { display: none; }
.nd.top { background: var(--brand); border-color: var(--brand); }
.nd.top .l, .nd.top .p { color: #fff; }

@media (max-width: 640px) {
  .kr li { grid-template-columns: minmax(0, 1fr); }
  .ct .cr { grid-template-columns: minmax(0, 1fr); }
  .phb { width: 88px; height: 110px; }
  .links { grid-template-columns: minmax(0, 1fr); }
  .tree ul { padding-left: 12px; }
  .tree li { padding-left: 14px; }
  .tree li::after { width: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const TARIHCE = [
  'Yozgat Bozok Üniversitesi İlahiyat Fakültesi, Yozgat ilinde din bilimleri ve ilahiyat eğitimi vermek amacıyla kurulmuştur. Fakültemizin kurulması, Millî Eğitim Bakanlığının 13.09.2010 tarihli ve 16319 sayılı yazısı üzerine, 28.03.1983 tarihli ve 2809 sayılı Kanunun ek 30’uncu maddesine göre, Bakanlar Kurulunca 13.09.2010 tarihinde kararlaştırılmıştır.',
  'Kuruluşundan bu yana hızla gelişen ve kaliteli eğitim anlayışını benimseyen İlahiyat Fakültemiz, İslami ilimlerin yanı sıra sosyal bilimler alanında da eğitim ve araştırma faaliyetleri yürütmektedir. Fakülte olarak amacımız, öğrencilere İslami ilimlerin temel konularında bilgi ve beceri kazandırmak, dinî ve ahlaki değerleri benimsemiş bireyler yetiştirmek; eleştirel düşünme ve analitik yetenekler kazandırarak dinî ve toplumsal sorunlara çözüm üretebilecek donanıma sahip olmalarını sağlamaktır.',
  'Fakültemiz, Bozok Üniversitesi Rektörlüğü ile hayırsever iş adamı Bilal ŞAHİN arasında yapılan protokol sonucu inşa edilen iki eğitim binası ve bir uygulama camisinden oluşmaktadır. Ana bina, Bilal ŞAHİN tarafından yapılarak 22.12.2011 tarihinde teslim edilmiştir. Yaklaşık 5.150 m² kapalı alana sahip bu binada 12 derslik, 2 büyük amfi, bir konferans salonu ve öğretim üyesi ofisleri yer almaktadır. Ek bina ise 27 derslik, 2 mescit, 4 dil laboratuvarı, kantin, konferans salonu, kütüphane ve öğretim elemanı ofislerinden oluşmaktadır. Bu binadaki kütüphane ve derslikler de Bilal ŞAHİN tarafından tefriş edilmiştir. İki bina arasında yine Bilal ŞAHİN tarafından yaptırılan uygulama camisi bulunmaktadır.',
  'İlahiyat Fakültesi, 2012 yılından itibaren öğrenci kabul etmekte olup, bir yıllık zorunlu hazırlık eğitiminin ardından dört yıllık lisans eğitimi sunmaktadır. Fakültemizde Temel İslam Bilimleri, Felsefe ve Din Bilimleri, İslam Tarihi ve Sanatları olmak üzere üç ana bölüm bulunmaktadır. Mezunlarımız, Diyanet İşleri Başkanlığı, Millî Eğitim Bakanlığı ve çeşitli kamu kurumlarında görev alabilmektedir.',
  'Kaliteli akademik kadrosu ve modern eğitim olanakları ile Türkiye’nin önemli ilahiyat fakültelerinden biri olma yolunda ilerleyen Yozgat Bozok Üniversitesi İlahiyat Fakültesi, öğrencilere çeşitli burs imkânları, yurt dışı eğitim programları ve bilimsel araştırma projeleri gibi imkânlar sunarak akademik ve kişisel gelişimlerine destek olmaktadır.',
  'Fakültemiz, Atatürk Yolu 7. km’de bulunan Bozok Üniversitesi Erdoğan Akdağ Doğu Kampüsü’nde yer almaktadır.'
];

const FIZIKI = [["p", "Yozgat Bozok Üniversitesi İlahiyat Fakültesi ana bina ve ek bina olmak üzere iki ayrı mekânda faaliyetlerini sürdürmektedir. Ek bina, 2019-2020 eğitim öğretim yılı bahar döneminde hizmete açılmıştır. Fakültemiz ek binası; derslikler, dil ve müzik sınıfları, kütüphane, bay ve bayan mescitleri ve konferans salonunun yanı sıra geniş kantin, kafeterya ve öğrenciler için dinlenme alanı gibi çeşitli imkânlar sunmaktadır. Bunun yanında akademik personel için rahat çalışma ortamı sunan ofisler ve bölümlere ait ortak alanlar bulunmaktadır. Fakültemizin ana bina restorasyonu ve çevre düzenlemesi hayırsever iş adamı Bilal ŞAHİN tarafından yaptırılmakta olup ek binayla entegre bir faaliyet alanı oluşturulmuştur."], ["p", "Yozgat Bozok Üniversitesi İlahiyat Fakültesi, güçlü ve gelişen akademik kadrosu, sosyal ve kültürel altyapısı ile nitelikli eğitim ve öğretimin adresi olmaya devam etmektedir."], ["h", "Kültür Merkezi"], ["p", "Büyük organizasyonlara ev sahipliği yapma potansiyeline sahip Erdoğan AKDAĞ Kongre ve Kültür Merkezi ile kampüs yaşamına katkı sağlayan Bozok Üniversitesi Sosyal Tesisleri hizmet vermektedir."], ["h", "Kütüphane"], ["p", "Biri üniversite, diğeri fakülte içinde olmak üzere iki kütüphane mevcut olup ilahiyat temel ilimlerine ait kitaplar bulunmaktadır. Fakülte kütüphanemiz ek binada olup binlerce elektronik kaynağa ve sosyal ve dinî içerikli kitaplara sahiptir."], ["h", "Bilgi-İşlem"], ["p", "Öğretim elemanlarının odalarının tamamında internet bağlantısı mevcuttur. Ayrıca Bilgi-İşlem biriminde dört adet bilgisayar araştırmacıların hizmetindedir. Bu birimde iki adet tarayıcı ve iki adet lazer yazıcı hizmete açıktır. Öğrencilerin bilgisayar dersleri için ayrı bir laboratuvar mevcut olup 20 bilgisayarla donatılmıştır. Bu bilgisayarlarda işletim sistemi, internet programları ve diğer paket programların kullanımı öğretilmekte ve uygulama yapılmaktadır."], ["h", "Spor Salonu"], ["p", "Kapalı spor salonu öğretim elemanları ve üniversite öğrencilerine yönelik hizmet vermektedir. Spor salonundan ayrıca ilk ve orta öğretim okulları da faydalanmaktadır. Spor salonunda basketbol, voleybol, salon futbolu ve masa tenisi aktiviteleri yapılmaktadır. Fakülte öğrencileri arasında her yıl basketbol ve voleybol turnuvaları düzenlenmektedir."], ["h", "Sosyal İmkânlar"], ["p", "Öğrencilerimiz ve personelimiz için kampüsümüzde merkezi yemekhane ve kafeterya, öğrencilerimiz için kız ve erkek öğrenci yurtları, mediko-sosyal merkezimizde sağlık imkânları bulunmaktadır. Öğrencilerimiz devlet destekli burslar yanında Bozok Üniversitesi Vakfımız, Bozok Üniversitesi İlahiyat Fakültesi Öğretim Üyeleri Derneğimiz ve sivil toplum örgütlerince sağlanan burs imkânlarından yararlanmaktadır. Öğrencilerimizin sportif ve kültürel faaliyetleri için üniversitemiz öğrenci konseyine ve öğrenci kulüplerimize destek verecek deneyimli akademik ve idari personelimiz mevcuttur. Tefrişatı devam eden Çarşı Binamız ise öğrencilerin kent merkezine inmeden tüm ihtiyaçlarını sağlayacak şekilde düzenlenmiştir. Çarşı Binasında kuaför, berber, banka, 7 adet dükkân, PTT, lokanta ve market bulunmaktadır. Kongre ve Kültür Merkezimiz ile üniversitemiz Orta Anadolu’nun en büyük kültür merkezine kavuşmuştur. Bu merkez büyük organizasyonlara rahatlıkla ev sahipliği yapma kapasitesine sahiptir."], ["h", "Cami"], ["p", "Fakültemizin hemen yanında 400 kişilik “Fakülte Camii” bulunmakta olup doğrudan öğrencilerimize hizmet etmektedir. Ayrıca Fen-Edebiyat Fakültesi binasının alt katında 300 kişilik bir mescit ve merkez kampüste 2.000 kişilik “Erdoğan Akdağ Camii” hizmet vermektedir."], ["h", "Kantin-Kafeterya"], ["p", "Kafeterya kapalı mekânda hizmet vermektedir. Burada her türlü sıcak ve soğuk meşrubat ile taze gıda ürünleri satılmaktadır. Ne kapalı mekânda ne de fakültenin çevrili bahçesinde sigara içilmesine müsaade edilmemektedir."], ["h", "Yemekhane"], ["p", "İlahiyat Fakültesi ana binasında yemekhane mevcuttur. Üniversite merkez yemekhanesi ise fakülteye takriben 400 m mesafede ve kampüsün tam ortasında hizmet vermektedir. Yemekhanelerde akademik ve idari personel ile öğrenciler, aynı binanın ayrı katlarında uygun bir fiyatla yemek yeme imkânına sahiptir. Ayrıca kampüs içerisinde Bozok Üniversitesi Sosyal Tesisleri, lezzetli ve çeşitli seçeneklerinin yanı sıra uygun fiyatlarıyla yemek hizmeti vermektedir."], ["h", "Barınma ve Burs İmkânları"], ["p", "Fakülte öğrencileri, Yüksek Öğrenim Kredi ve Yurtlar Kurumu’nun merkez kampüsünün yanında bulunan yurtlarında ve şehir içinde bulunan özel vakıflara ait yurtlarda barınabilir."], ["h", "Kampüste Yaşam"], ["p", "Öğrencilerin genellikle bir arada bulundukları mekânlar, fakülte bahçesi ve kafeteryadır. Kütüphane, bilgi-işlem merkezi ve spor salonu öğrencilerin ders dışı zamanlarını değerlendirdikleri diğer mekânlardır."]];
const KATKI = [{"n": "Bilal ŞAHİN", "p": ["Yozgat’ın Sorgun İlçesine bağlı şimdiki adı Esenli Kasabası olan Dedik Köyü’nde 01.01.1941 tarihinde doğdu. Babası, zamanın okumuş kişilerinden İnzibat Astsubayı Şevket Bey’dir. Annesi, çevresinde hayır sahibi olarak tanınan maruf bir ailenin kızı Zeynep Hanım’dır. 1954 yılında ilkokulu başarı ile bitirdikten sonra, Niğde–Aksaray Teknik Ziraat Okulu imtihanlarını kazanmış ve buradan 1958 yılında mezun olmuştur.", "1958-1959 eğitim öğretim döneminde Sorgun ilçesine bağlı Çamurlu Köyü İlkokulu’nda vekil öğretmenlik yapmıştır. 1959-1961 yıllarında Toprak Mahsulleri Ofisi Sekili Ajans Müdürlüğü’nde Tesellüm Memuru olarak çalışmıştır. 1961-1963 yıllarında vatani (askerlik) görevini yerine getiren Bilal Şahin, 1964 yılında memur olarak başladığı Maliye Teşkilatı’nda iki yıl çalıştıktan sonra 3 yıla yakın bir süre de Yozgat İl Müftülüğü’nde personel şefliği görevinde bulunmuştur. 1969 yılında Almanya'ya işçi olarak gitmiştir.", "1969 yılında Almanya’ya işçi olarak giden Bilal Şahin burada 9 ay lisans öğrenimi görmüş ve hemşerilerini vatanına hayırlı bir hizmet görmek üzere örgütleme çabasına girmiştir. Yoğun bir süreç sonunda, bugün Türkiye ekonomisine mal olmuş Yozgat İşçi Birliği Malzemeleri Ticaret ve Sanayi A.Ş.’nin (YİBİTAŞ) temelini 33 arkadaşı ile birlikte 23 Ocak 1973 tarihinde atmıştır. Ülkemizin dört bir köşesinden katılan vatandaşlarla 14.000 ortaklı YİBITAŞ’ı kurmuştur. Şirketin ilk yatırımı Yozgat Sarayköy’de yapılan çimento fabrikasıdır.", "Sınai mülkiyetin tabana yaygınlaştırılması stratejisinin ilk örneklerinden olan YİBİTAŞ Çimento Fabrikasını takiben başta Kraft Torba, Un, Yem ve Tuğla Fabrikaları olmak üzere üretim ve hizmet sektöründe faaliyet gösteren 17 şirketin bulunduğu YİBİTAŞ topluluğu kurucularından olma bahtiyarlığını yaşamış ve hâlen YİBİTAŞ topluluğuna ait tüm şirketlerde yönetim kurulu üyesidir.", "Sınai yatırımlarının yanı sıra, başta doğum yeri olan Dedik Köyü'nün Gelingüllü Baraj sularına gömülen yerleşim merkezinin, Esenli Kasabası olarak iskân ve imarı çalışmalarına tek başına soyunmuştur. Servetini bu uğurda harcamaktan büyük bir keyif alan Bilal Şahin, Esenli Kasabası’nı alt yapısı, eğitim öğretim, sosyal ve idari tesisleri, ibadet mahalleri ile modern bir yerleşim merkezi haline getirme başarısına ulaşmış, hatta ilçe adayı yapmıştır.", "Yozgat'ta, Bilal Şahin Camii, Naciye Afet Şahin Kız Hafız Kur'an Kursu, Bilal Şahin Erkek Hafız Kur'an Kursu, Müftülük Binası ve lojmanlarından oluşan Bilal Şahin Külliyesi’ni yaptırmıştır. Külliyeyi oluşturan bu tesisler Diyanet İşleri Başkanlığı’na teslim edilmiştir. Şahin Tepesi Sosyal Tesislerini, Bilal Şahin Mahallesi’nde Gençlik Merkezi ve Nikâh Salonu’nu yaptırıp Yozgat Belediyesi’ne devretmiştir.", "Gedikhasan Kasabası’nda Kutbu Cihan Mehmet Şakir Efendi Türbesi, Kur'an Kursları, Medrese ve Camisi’nden oluşan büyük bir külliye yaptırıp Diyanet İşleri Başkanlığı’na devretmiştir. Gedikhasan’da Kur'an Kursu, çeşmeler, köprüler ve kilitli taş yolları yaptırıp hizmete sunmuştur. Ayrıca Gedikhasan İlköğretim Okulu’nu da yeniden yaptırıp Milli Eğitim Bakanlığı’na devretmiştir. Yaptığı hizmetlerin devamlılığının takipçisi olan Bilal Şahin, her yıl kendi yaptırdığı okul ve Kur'an Kurslarındaki öğrenci ve hafızları başarılarına göre ödüllendirmiştir.", "Yozgat’ın eğitimine ve kalkınmasına büyük önem veren Bilal Şahin Yozgat Bozok Üniversitesi’ni de geliştirmek adına tüm imkânlarını seferber etmiştir. 2012’de Yozgat Bozok Üniversitesi’nde Bilal Şahin İlahiyat Fakültesi binasını ve Uygulama Camii’ni inşa ettirip Üniversite’ye devretmiştir. 2020’de Yozgat Bozok Üniversitesi Bilal Şahin Batı Kampüsü giriş kapısını inşa ettirmiş, Bilal Şahin İlahiyat Fakültesi’nde iki bilgisayar laboratuvarını, Ek binada 13 derslik ile iki öğretim üyesi odasının tefrişatını, Bilal Şahin İlahiyat Fakültesi’nin çevre düzenlemesini yaptırmış ve Tıp Fakültesi Hastanesi’nde Bilal Şahin Diyaliz Merkezi’ni kurdurmuştur. 2021’de ise Bilal Şahin Türkçe mler Enstitüsü Yönetim Kurulu Üyeliği ve Devlet Bakanlığı Müşavirliği yaptı. 1994-2002’de Felsefe ve Din Bilimleri Bölüm başkanı olarak görev yaptı. İslam felsefesi dersleri verdi. Türk Felsefe Derneği üyesidir. Erzurumlu İbrahim Hakkı (1997) İbn-i Sina Metafiziği (1985), Tasavvuf Tarihi (1986), İnsan ve Psikoloji (1989), Mustafa Şekip Tunç (1989), İslâm Ahlakı (1999), Ahlâk Felsefesi (1999) adlı çalışmaları vardır."], "ph": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wgARCAJYAeADASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECAwQFBgf/xAAaAQADAQEBAQAAAAAAAAAAAAAAAQIDBAUG/9oADAMBAAIQAxAAAAHiIPS+cE0AwAABMAAAQANMBAAAACaaGAmmA0AwGgGCYAhgIGwASAGMTATaINgCYxDSAaAYAk0DTGIYCTAAEwYCGAgAFJANACaAaAFIQguVUnT2TfBffqHxbu10stfNdHsvHfknQyK8MOq6jz+P1cdcfLPpR25uc5xuEMaASAGCGMTTREkgAYRAAAAAYJoABNobABJDBiGCGAh3Iolq9Bnr5jf7C/Lq8529efDruXI5kX6leZ1h1KuFAVmLl5WvRUckDoaOLYnp28TQHrLOFlF63ir0euPho+25HVxcBWQ15gBgNADQhMTQMQgGJgIBgAAAgAAYMEwEMQpX9nPTi+j6mjn782i/Lh1yz8iyXqwvIlTjudRmtopC7PRS6iMZYVJrXVWIunjtHtghLf1vMb0eq6Hld6fU8t6W7bDwj6PP7fMQ1eaYgAAQNNNDAABDQhoAYAAADBAwV9XSiun3aL+H2NVddcbz5N0JXD3UUuehgvxIx5dEm8x2c6fGp35qVVcVScG2wjALXRIW3VgtU6nTNLq9Hz/bT19XClWvznrMOuHkFsyd/kxGOUNMQwEwBMAQAwABoBgJJgMamjT6XDs5PS6cubdzdul45p4KdWYRg6FI+cWxm6N89Ea25elylXE5vX5+meCFy2yrjbS0kwcbIsUrISS1zq0KdeqNsvb1OP3lVzUB0+O9z5jr83ljXZ5yAGmAIYCYAgYIBANAAACYHQwa409Fp8nDg9f1mTLKLtnhA6Ty6FVUiEbvLpWe9eunTNPm9alHGo71TPNHppXn4rH7Ln6ZeZj1sOsZyapK2FiV2qqyXo6GXp53d04Wo04bsNZvo83fefkafTeb9DxYJmuSGgaaAATTBiGIiwABghgS6d2bl7sGGZh16NeDXJ0tPO1zrvJzjWiycsuqDnPPaqxyai5NEZSk1UXRZRTtYuDz/WZaXjMXu+dU+Xv6mofPt61kXz9WmaHopm4qwbefrzy08erTm9R5XXh6uGkDs89MAGhCGAmm2lJIQwEDA15Lpr2Pifa/POH1oTp0TRvzakdDbm0xrssqsjaaRj1ycJTcrITByjNzYMqQmNVjacK7ojqo2sOVo1JVQ7wVKtgOiq6mXTnvy3Bk04unzVCOro4uaac3b5wA0JgAAJgCGkAAAwC2u1V6LxPofJcXrat/J3xfW0cbTD6erFsnXXZEz3bI49UmpTcp1TCxxdKy2i1 rta ve lise tahsilini Kırşehir’de tamamladı. On Dokuz Mayıs Üniversitesi İlahiyat Fakültesi’nde lisans eğitimini; Marmara Üniversitesi Sosyal Bilimler Enstitüsü’nde “Çağdaş Yayıncılık ve Yayıncılık Yönetimi” Yüksek Lisansını tamamladı. 1997-2020 yıllarında Diyanet İşleri Başkanlığı’nın çeşitli kademelerinde görev aldı. 2011-2013 yıllarında Diyanet Aylık Dergi editörlüğünü, 2013-2020 yıllarında ise İstanbul Müftülüğü Din ve Hayat Dergisi’nin editörlüğünü yürüttü. 2020 yılından bu yana Yozgat Bozok Üniversitesi Yozgat Meslek Yüksek Okulu Görsel-İşitsel Teknikler ve Medya Yapımcılığı Bölümü’nde öğretim görevlisi olarak görev yapmaktadır. Türkiye’nin Sıhhi, İçtimai Coğrafyası, Kırşehri Vilayeti (2003), II. Abdülhamid’in Şeyhi Şeyh Muhammed Zafir ve Ertuğrul Tekkesi (2004), Gülistan- Ramazan İlahileri ve Kasideleri (2008), Âlim, Fakih, Müftü: Ömer Nasuhi Bilmen (1883-1971) (2014), Hicaz Yolları -Cumhuriyet Dönemi Bir Taşra Müftüsü’nün Hac Hatıraları- (2015), Bu Toprakları Mayalayanlar-Portre Denemeleri (2017), Âkif’in Mısır Günlerinde Hakikatli Bir Dost: Mehmed İhsan Efendi (2017) Lâle Der ki, -Şehir ve Medeniyet Nişaneleri- (2020) gibi çeşitli çalışmaları vardır."], "ph": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wgARCAJYAeADASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAwECBAUGAAcI/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/aAAwDAQACEAMQAAAB9U5jxd3cMWZvqRzZ+Fe2+IxbBEZNduMR6LU38mfatZCv3/B5vXes8HhrPW7kPn6F9F14fPjd/hExCOIGLz0+LO0LWTj+h4cI/r/lfq4iva4hUXmNRygNyKx1PcU2dRNJnNFjYAGb18vAfHaNU3DJ0obUOeTsJ8ommBChaOYUJctjt1vXWOHteDzMGujk03nHrvksahR3TTdxib2p9VvfNL+89Z2TIPUdnCoBosNo2rngvVeeeY+j+cTQhlENJsO1Db7XJbK8YcSXZtYa0IOaI5r0Jy8Cd3Aitczqa5pMrj6PPaHNxO4XVzRAT2SqC+zp6IVnUXSLp1PaXPcqpnK1ct9n3dd9wiiqlFKFUePeveRxpGVFT70bzr0ip280Ranmu4YodjwvPL818TUwtHw/GMnusLOgxGEhtlW3bNPtMzsbxrLrL2jUF1dZTT3jdI5vIxOXg5UVr /* ---------- Tabs and direct links (#hakkimizda, #teskilat, #hizmetler, or a block id such as #komisyonlar) ---------- */
const TABS = [['hakkimizda', 'Hakkımızda'], ['teskilat', 'Teşkilat'], ['hizmetler', 'Hizmetler']];
function select(id) {
  if (!TABS.some(t => t[0] === id)) id = 'hakkimizda';
  TABS.forEach(([k]) => { $('p-' + k).hidden = k !== id; $('t-' + k).setAttribute('aria-selected', String(k === id)); $('t-' + k).tabIndex = k === id ? 0 : -1; });
}
TABS.forEach(([k, t], i) => {
  const b = el('button', 'tab', t); b.type = 'button'; b.id = 't-' + k; b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', 'p-' + k);
  b.addEventListener('click', () => select(k));
  b.addEventListener('keydown', e => { const j = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (j) { const n = TABS[(i + j + TABS.length) % TABS.length][0]; select(n); $('t-' + n).focus(); } });
  $('tabs').appendChild(b);
});
function route() {
  const h = decodeURIComponent(location.hash.slice(1)), target = h && $(h);
  if (target && target.tagName === 'DETAILS') { const pn = target.closest('[role=tabpanel]'); select(pn.id.slice(2)); target.open = true; target.scrollIntoView(); }
  else select(h);
}
route(); addEventListener('hashchange', route);

})();
